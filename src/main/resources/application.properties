spring.application.name=integration-service
spring.config.import=optional:file:./.env[.properties]
spring.data.redis.timeout=15s
ai.redis.namespace=${AI_REDIS_NAMESPACE:}
spring.main.lazy-initialization=true
server.port=8080
logging.level.org.springframework.web=WARN
spring.mongodb.uri=${MONGODB_URI}
management.health.mongodb.enabled=false

google.gemini.api-key=${GEMINI_API_KEY:}
google.gemini.api-keys=${GEMINI_API_KEY_1:},${GEMINI_API_KEY_2:},${GEMINI_API_KEY_3:},${GEMINI_API_KEY_4:},${GEMINI_API_KEY_5:}
google.gemini.model=${GEMINI_MODEL:gemini-3.6-flash}
pinecone.api-key=${PINECONE_API_KEY}
pinecone.index-name=devtinder-intelligence-hub


spring.data.redis.url=${REDIS_URL}
spring.data.redis.ssl.enabled=true
spring.mvc.async.request-timeout=600000
## Android/web AI requests arrive through the authenticated Node gateway.
ai.gateway.secret=${AI_GATEWAY_SECRET:}
ai.gateway.required=${AI_GATEWAY_REQUIRED:true}
